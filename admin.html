    if (edit.scale.length < 2) { msg = "Add at least two rating choices before publishing."; render(); return; }
    if (!str(keys.pw)) { msg = "Enter your host password at the top first."; render(); return; }
    busy = "Publishing…"; msg = null; render();
    B.post({ action: "savePoll", password: keys.pw, newRound: !!edit.newRound,
      poll: { title: str(edit.title).slice(0, 120) || "Movie Night Ballot", note: str(edit.note).slice(0, 500), showResults: !!edit.showResults, scale: edit.scale.slice(0, 12), movies: movies } }).then(function (r) {
      busy = "";
      if (r && r.ok) { live = r.poll; startEdit(); votes = null; } else msg = adminError(r && r.error);
      render(); window.scrollTo(0, 0);
    }).catch(function () { busy = ""; msg = "The script couldn’t be reached. Check the URL in config.js and that the script is deployed for Anyone."; render(); });
  }
  function loadVotes() {
    if (!str(keys.pw)) { votesMsg = "Enter your host password on the Set up tab first."; return; }
    votesMsg = "Loading responses…";
    B.post({ action: "adminResults", password: keys.pw }).then(function (r) {
      if (r && r.ok) { votes = r.votes || []; votesMsg = null; } else votesMsg = adminError(r && r.error);
      if (view === "results") render();
    }).catch(function () { votesMsg = "The script couldn’t be reached. Try again in a moment."; if (view === "results") render(); });
  }
  function viewResults() {
    var s = h("section", { class: "stack" });
    if (!live) { s.appendChild(h("p", { class: "muted" }, "Publish a poll first.")); return s; }
    if (votesMsg) s.appendChild(h("p", { class: "muted", role: "status" }, votesMsg));
    if (votes) B.resultsNodes(live, votes, { search: true, onRemove: function (v, btn) {
      if (btn.dataset.sure !== "1") { btn.dataset.sure = "1"; btn.textContent = "Confirm remove"; setTimeout(function () { btn.dataset.sure = ""; btn.textContent = "Remove"; }, 4000); return; }
      btn.disabled = true;
      B.post({ action: "deleteVote", password: keys.pw, voterKey: v.voterKey }).then(function (r) { if (r && r.ok) { votes = r.votes || []; } else votesMsg = adminError(r && r.error); render(); }, function () { votesMsg = "Couldn’t remove that response."; render(); });
    } }).forEach(function (n) { s.appendChild(n); });
    s.appendChild(h("div", { class: "row" }, h("button", { class: "btn ghost", type: "button", onclick: function () { loadVotes(); render(); } }, "Refresh"),
      h("span", { class: "muted small" }, "Every response is also a row in your Google Sheet.")));
    return s;
  }
  function startEdit() {
    edit = live ? JSON.parse(JSON.stringify(live)) : { title: "", note: "Rate each film. Pick “Didn’t watch” for anything you skipped.", showResults: true, scale: ["1", "2", "3", "4", "5", "Didn’t watch"], movies: [] };
    edit.movies.forEach(function (m) { m.alts = []; });
    edit.newRound = false;
  }

  if (!B.ready()) { app.textContent = ""; app.appendChild(h("p", { class: "note warn" }, "Not connected yet. Open config.js, paste your Google Apps Script Web app URL into it, and upload it again. The README has the steps.")); return; }
  B.get("poll").then(function (r) { live = (r && r.ok && r.poll) || null; startEdit(); render(); })
    .catch(function () { startEdit(); msg = "The script couldn’t be reached. Check the URL in config.js and that the script is deployed with access set to Anyone."; render(); });
})();
</script>
